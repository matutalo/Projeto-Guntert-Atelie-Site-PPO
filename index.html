<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Guntert Ateliê</title>
</head>
<body>
    
    <div class="perfil">
        <h1>Perfil</h1>
        <p>Nome</p>
    </div>
    <div class="armazenamento">
        <h1>Armazenamento</h1>
        <p>Insira um produto</p>
        <input type="text" id="custo_storage" name="custo" min="0" placeholder="Nome do Produto">
    </div>
    <div class="calculo">
        <h1>Calculadora</h1>
        <p>Custo do Material (R$)</p>
        <input type="number" id="custo" name="custo" min="0" placeholder="R$0,00">
        <p>Tempo de Trabalho</p>
        <input type="time" id="tempo" name="custo" min="0" placeholder="0h0min">
        <p>Valor da Hora</p>
        <input type="number" id="valorhora" name="valorhora" min="0" placeholder="R$0,00">
        <p>Porcentagem de lucro</p>
        <input type="number" id="lucro" name="lucro" min="0%" placeholder="0%">
        <button id="calcular">Calcular</button>
<p id="resultado"></p>
    </div>
</body>
</html>
